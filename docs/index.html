<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <title>灾前灾后对比</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/gallery.js" defer></script>
  <script src="assets/change_regions.js" defer></script>
  <script src="assets/workspace.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="title-row">
        <h1 id="heading" data-en="Before and after">灾前灾后对比</h1>
        <div class="title-meta">
          <span id="place" aria-live="polite"></span>
          <nav id="languages" aria-label="选择语言" data-en-label="Choose language">
            <a href="?lang=zh" lang="zh-CN" hreflang="zh-CN">中文</a>
            <a href="?lang=en" lang="en" hreflang="en">English</a>
          </nav>
        </div>
      </div>
      <div id="cases" role="group" aria-label="选择灾害案例" data-en-label="Choose a disaster"></div>
    </header>
    <article aria-labelledby="heading">
      <div class="comparison">
        <figure id="before">
          <figcaption><strong data-en="Before">灾前</strong><time></time></figcaption>
          <div class="frame"><a class="photo" target="_blank" rel="noopener" aria-label="打开放大的灾前影像（新标签页）" data-en-label="Enlarge the before image (opens in a new tab)"><img alt=""><span class="rings" aria-hidden="true"></span></a></div>
        </figure>
        <figure id="baseline">
          <figcaption><strong data-en="After · baseline">灾后 · 基线</strong><time></time></figcaption>
          <div class="frame"><a class="photo" target="_blank" rel="noopener" aria-label="打开放大的基线灾后圈注图（新标签页）" data-en-label="Enlarge the baseline annotated after image (opens in a new tab)"><img alt=""><span class="rings" aria-hidden="true"></span></a></div>
        </figure>
        <figure id="ours">
          <figcaption><strong data-en="After · reviewed result">灾后 · 改进结果</strong><time></time></figcaption>
          <div class="frame"><a class="photo" target="_blank" rel="noopener" aria-label="打开放大的改进结果灾后圈注图（新标签页）" data-en-label="Enlarge the reviewed annotated after image (opens in a new tab)"><img alt=""><span class="rings" aria-hidden="true"></span></a></div>
        </figure>
      </div>
      <div class="legend" role="note" aria-label="圈选图例" data-en-label="Annotation legend">
        <span><i class="legend-swatch baseline-swatch" aria-hidden="true"></i><span data-en="Baseline single candidate">基线单候选</span></span>
        <span><i class="legend-swatch ours-swatch" aria-hidden="true"></i><span data-en="Reviewed result">改进结果圈</span></span>
      </div>
      <div class="reading">
        <section class="explanation"><h2 data-en="What changed">证据说明</h2><p id="evidence"></p></section>
        <dl class="finding">
          <div><dt data-en="Hazard type">灾害类型</dt><dd id="type"></dd></div>
          <div><dt data-en="Impact">受灾程度</dt><dd id="severity"></dd><dd id="basis"></dd></div>
        </dl>
      </div>
      <footer><a id="source" href="DATA-NOTICE.md"></a><a id="credits" href="DATA-NOTICE.md" data-en="Image credits and licenses">影像署名与许可</a></footer>
    </article>
    <noscript>请在浏览器中启用 JavaScript，查看灾前灾后案例。 <span lang="en">Enable JavaScript to compare the images.</span></noscript>
  </main>
</body>
</html>
