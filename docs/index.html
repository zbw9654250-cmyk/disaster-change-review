<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <title>灾前灾后对比</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/gallery.js" defer></script>
  <script src="assets/workspace.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="title-row"><h1 id="heading">灾前灾后对比</h1><span id="place" aria-live="polite"></span></div>
      <div id="cases" role="group" aria-label="选择灾害案例"></div>
    </header>
    <article aria-labelledby="heading">
      <div class="comparison">
        <figure id="before">
          <figcaption><strong>灾前</strong><time></time></figcaption>
          <div class="frame"><a class="photo" target="_blank" rel="noopener" aria-label="打开放大的灾前圈注图（新标签页）"><img alt=""><span class="rings" aria-hidden="true"></span></a></div>
        </figure>
        <figure id="after">
          <figcaption><strong>灾后</strong><time></time></figcaption>
          <div class="frame"><a class="photo" target="_blank" rel="noopener" aria-label="打开放大的灾后圈注图（新标签页）"><img alt=""><span class="rings" aria-hidden="true"></span></a></div>
        </figure>
      </div>
      <div class="reading">
        <section class="explanation"><h2>证据说明</h2><p id="evidence"></p></section>
        <dl class="finding">
          <div><dt>灾害类型</dt><dd id="type"></dd></div>
          <div><dt>受灾程度</dt><dd id="severity"></dd><dd id="basis"></dd></div>
        </dl>
      </div>
      <footer><a id="source" href="DATA-NOTICE.md"></a><a href="DATA-NOTICE.md">影像署名与许可</a></footer>
    </article>
    <noscript>请在浏览器中启用 JavaScript，查看灾前灾后案例。</noscript>
  </main>
</body>
</html>
