name: Test project

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: >
          python -m pip install pytest
          -r modules/roof_candidates/requirements.txt
          -r modules/buildings/requirements.txt
          -r modules/observations/requirements.txt
      - name: Run CPU unit tests
        run: |
          python -m pytest -q modules
      - name: Check public links and run the example
        run: python scripts/check_release.py
